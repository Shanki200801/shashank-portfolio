<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="The Pomodoro technique — 25 minute focus blocks">
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f22"/>
      <stop offset="0.55" stop-color="#1a1030"/>
      <stop offset="1" stop-color="#070915"/>
    </linearGradient>
    <linearGradient id="parc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="0.5" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <radialGradient id="pglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="pgrid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#pbg)"/>
  <rect width="1600" height="900" fill="url(#pgrid)"/>
  <circle cx="1120" cy="450" r="420" fill="url(#pglow)"/>

  <!-- timer dial -->
  <g transform="translate(1120 450)">
    <circle r="230" fill="#0f1426" stroke="#ffffff" stroke-opacity="0.10" stroke-width="2"/>
    <circle r="190" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="26"/>
    <!-- ~78% of a 25-minute block elapsed -->
    <circle r="190" fill="none" stroke="url(#parc)" stroke-width="26" stroke-linecap="round"
            stroke-dasharray="931 1194" transform="rotate(-90)"/>
    <text x="0" y="8" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="96" fill="#eaecf7">25:00</text>
    <text x="0" y="64" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="28" fill="#7c85a8" letter-spacing="6">FOCUS</text>
  </g>

  <!-- completed pomodoros -->
  <g transform="translate(150 620)">
    <g fill="#a855f7">
      <rect x="0" y="0" width="34" height="34" rx="9"/>
      <rect x="52" y="0" width="34" height="34" rx="9"/>
      <rect x="104" y="0" width="34" height="34" rx="9"/>
      <rect x="156" y="0" width="34" height="34" rx="9"/>
    </g>
    <rect x="208" y="0" width="34" height="34" rx="9" fill="#ffffff" fill-opacity="0.14"/>
    <rect x="260" y="0" width="34" height="34" rx="9" fill="#ffffff" fill-opacity="0.14"/>
    <text x="0" y="86" font-family="ui-sans-serif, system-ui, sans-serif" font-size="26" fill="#7c85a8">4 blocks done · long break next</text>
  </g>

  <!-- rhythm bars: work / break -->
  <g transform="translate(150 400)">
    <rect x="0" y="0" width="150" height="18" rx="9" fill="#6366f1"/>
    <rect x="164" y="0" width="40" height="18" rx="9" fill="#2dd4bf"/>
    <rect x="218" y="0" width="150" height="18" rx="9" fill="#6366f1"/>
    <rect x="382" y="0" width="40" height="18" rx="9" fill="#2dd4bf"/>
    <rect x="436" y="0" width="150" height="18" rx="9" fill="#6366f1" fill-opacity="0.5"/>
  </g>

  <text x="150" y="230" font-family="ui-monospace, SFMono-Regular, monospace" font-size="42" fill="#eaecf7" letter-spacing="6">POMODORO</text>
  <text x="150" y="292" font-family="ui-sans-serif, system-ui, sans-serif" font-size="34" fill="#9aa3c4">25 minutes of one thing.</text>
  <text x="150" y="340" font-family="ui-sans-serif, system-ui, sans-serif" font-size="34" fill="#9aa3c4">Then five minutes of nothing.</text>
</svg>
