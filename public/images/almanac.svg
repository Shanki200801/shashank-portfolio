<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Almanac — a daily research and writing platform">
  <defs>
    <linearGradient id="abg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0c1e"/>
      <stop offset="0.5" stop-color="#101a33"/>
      <stop offset="1" stop-color="#070915"/>
    </linearGradient>
    <linearGradient id="apen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <radialGradient id="aglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="agrid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#abg)"/>
  <rect width="1600" height="900" fill="url(#agrid)"/>
  <circle cx="1180" cy="280" r="440" fill="url(#aglow)"/>

  <!-- calendar of days: one subject a day -->
  <g transform="translate(140 230)">
    <rect x="0" y="0" width="520" height="440" rx="28" fill="#0f1426" stroke="#ffffff" stroke-opacity="0.12"/>
    <rect x="0" y="0" width="520" height="76" rx="28" fill="#6366f1" fill-opacity="0.18"/>
    <text x="34" y="50" font-family="ui-monospace, SFMono-Regular, monospace" font-size="28" fill="#a5b4fc" letter-spacing="4">TODAY'S SUBJECT</text>
    <g fill="#ffffff" fill-opacity="0.10">
      <rect x="34" y="112" width="82" height="66" rx="12"/>
      <rect x="140" y="112" width="82" height="66" rx="12"/>
      <rect x="246" y="112" width="82" height="66" rx="12"/>
      <rect x="352" y="112" width="82" height="66" rx="12"/>
      <rect x="34" y="196" width="82" height="66" rx="12"/>
      <rect x="246" y="196" width="82" height="66" rx="12"/>
      <rect x="352" y="196" width="82" height="66" rx="12"/>
      <rect x="34" y="280" width="82" height="66" rx="12"/>
      <rect x="140" y="280" width="82" height="66" rx="12"/>
      <rect x="246" y="280" width="82" height="66" rx="12"/>
    </g>
    <rect x="140" y="196" width="82" height="66" rx="12" fill="#2dd4bf" fill-opacity="0.85"/>
    <rect x="352" y="280" width="82" height="66" rx="12" fill="#a855f7" fill-opacity="0.45"/>
    <text x="34" y="400" font-family="ui-sans-serif, system-ui, sans-serif" font-size="26" fill="#7c85a8">research → write → publish → read others</text>
  </g>

  <!-- essay being written -->
  <g transform="translate(760 200)">
    <rect x="0" y="0" width="700" height="500" rx="28" fill="#0f1426" stroke="#ffffff" stroke-opacity="0.12"/>
    <g fill="#ffffff" fill-opacity="0.16">
      <rect x="48" y="70" width="420" height="20" rx="10"/>
      <rect x="48" y="128" width="600" height="14" rx="7"/>
      <rect x="48" y="166" width="560" height="14" rx="7"/>
      <rect x="48" y="204" width="590" height="14" rx="7"/>
      <rect x="48" y="242" width="470" height="14" rx="7"/>
      <rect x="48" y="300" width="600" height="14" rx="7"/>
      <rect x="48" y="338" width="520" height="14" rx="7"/>
    </g>
    <rect x="48" y="70" width="420" height="20" rx="10" fill="#eaecf7" fill-opacity="0.85"/>
    <rect x="578" y="334" width="4" height="22" fill="#2dd4bf"/>
    <rect x="48" y="410" width="200" height="52" rx="14" fill="url(#apen)"/>
    <text x="86" y="443" font-family="ui-sans-serif, system-ui, sans-serif" font-size="24" fill="#07121a" font-weight="600">Publish</text>
  </g>

  <text x="140" y="130" font-family="ui-monospace, SFMono-Regular, monospace" font-size="42" fill="#eaecf7" letter-spacing="6">ALMANAC</text>
  <text x="140" y="178" font-family="ui-sans-serif, system-ui, sans-serif" font-size="26" fill="#7c85a8">one subject a day · learn by writing, not scrolling</text>
</svg>
