<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="QShare — peer-to-peer encrypted file transfer">
  <defs>
    <linearGradient id="qbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f22"/>
      <stop offset="0.55" stop-color="#141033"/>
      <stop offset="1" stop-color="#070915"/>
    </linearGradient>
    <linearGradient id="qline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="0.5" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <radialGradient id="qglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="qgrid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#qbg)"/>
  <rect width="1600" height="900" fill="url(#qgrid)"/>
  <circle cx="300" cy="450" r="420" fill="url(#qglow)"/>
  <circle cx="1300" cy="450" r="420" fill="url(#qglow)" opacity="0.7"/>

  <!-- transfer path -->
  <path d="M420 450 C 640 250, 960 650, 1180 450" fill="none" stroke="url(#qline)" stroke-width="6" stroke-linecap="round" stroke-dasharray="26 20" opacity="0.9"/>

  <!-- peers -->
  <g>
    <circle cx="380" cy="450" r="96" fill="#101426" stroke="#6366f1" stroke-width="4"/>
    <rect x="344" y="424" width="72" height="56" rx="10" fill="none" stroke="#a5b4fc" stroke-width="5"/>
    <path d="M362 424v-18a18 18 0 0 1 36 0v18" fill="none" stroke="#a5b4fc" stroke-width="5" stroke-linecap="round"/>
    <circle cx="380" cy="452" r="7" fill="#2dd4bf"/>
  </g>
  <g>
    <circle cx="1220" cy="450" r="96" fill="#101426" stroke="#a855f7" stroke-width="4"/>
    <rect x="1184" y="424" width="72" height="56" rx="10" fill="none" stroke="#c084fc" stroke-width="5"/>
    <path d="M1202 424v-18a18 18 0 0 1 36 0v18" fill="none" stroke="#c084fc" stroke-width="5" stroke-linecap="round"/>
    <circle cx="1220" cy="452" r="7" fill="#2dd4bf"/>
  </g>

  <!-- chunks in flight -->
  <g fill="#2dd4bf">
    <rect x="640" y="336" width="26" height="26" rx="6" opacity="0.9"/>
    <rect x="792" y="452" width="26" height="26" rx="6" opacity="0.7"/>
    <rect x="944" y="556" width="26" height="26" rx="6" opacity="0.5"/>
  </g>

  <!-- pairing code -->
  <g transform="translate(560 690)">
    <rect x="0" y="0" width="480" height="86" rx="18" fill="#0f1426" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="40" y="56" font-family="ui-monospace, SFMono-Regular, monospace" font-size="34" fill="#9aa3c4">$</text>
    <text x="74" y="56" font-family="ui-monospace, SFMono-Regular, monospace" font-size="34" fill="#eaecf7">7-tiger-cloud</text>
    <rect x="368" y="30" width="16" height="34" fill="#2dd4bf"/>
  </g>

  <text x="80" y="120" font-family="ui-monospace, SFMono-Regular, monospace" font-size="42" fill="#eaecf7" letter-spacing="6">QSHARE</text>
  <text x="80" y="168" font-family="ui-sans-serif, system-ui, sans-serif" font-size="26" fill="#7c85a8">end-to-end encrypted transfer · written in Go</text>
</svg>
