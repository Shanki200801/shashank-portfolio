<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Endurance running — from zero to 25k trail runs">
  <defs>
    <linearGradient id="rsky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0d20"/>
      <stop offset="0.45" stop-color="#1b1338"/>
      <stop offset="1" stop-color="#2a1633"/>
    </linearGradient>
    <linearGradient id="rline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="0.55" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="rfill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="rsun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="0.6" stop-color="#f472b6" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#rsky)"/>
  <circle cx="1180" cy="300" r="300" fill="url(#rsun)"/>
  <circle cx="1180" cy="300" r="82" fill="#fcd34d" opacity="0.9"/>

  <!-- distant ridges -->
  <path d="M0 560 L220 420 L360 500 L560 360 L760 520 L900 440 L1120 560 L1320 470 L1600 580 L1600 900 L0 900 Z" fill="#0d1126" opacity="0.85"/>
  <path d="M0 660 L260 540 L470 640 L700 500 L940 640 L1180 560 L1420 660 L1600 600 L1600 900 L0 900 Z" fill="#090c1c"/>

  <!-- elevation profile of a 25k -->
  <path d="M120 720 L280 640 L400 672 L540 540 L680 600 L820 470 L980 560 L1120 430 L1280 520 L1460 470 L1460 780 L120 780 Z" fill="url(#rfill)"/>
  <path d="M120 720 L280 640 L400 672 L540 540 L680 600 L820 470 L980 560 L1120 430 L1280 520 L1460 470"
        fill="none" stroke="url(#rline)" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="1460" cy="470" r="14" fill="#2dd4bf"/>
  <circle cx="120" cy="720" r="10" fill="#6366f1"/>

  <!-- distance markers -->
  <g font-family="ui-monospace, SFMono-Regular, monospace" font-size="22" fill="#7c85a8">
    <text x="104" y="822">0k</text>
    <text x="520" y="822">8k</text>
    <text x="960" y="822">17k</text>
    <text x="1420" y="822">25k</text>
  </g>

  <!-- runner -->
  <g transform="translate(1096 356)" stroke="#eaecf7" stroke-width="9" stroke-linecap="round" fill="none">
    <circle cx="26" cy="6" r="15" fill="#eaecf7" stroke="none"/>
    <path d="M8 34 L34 52 L24 84"/>
    <path d="M34 52 L58 40"/>
    <path d="M8 34 L-16 46"/>
    <path d="M24 84 L2 104"/>
    <path d="M24 84 L52 96"/>
  </g>

  <text x="120" y="180" font-family="ui-monospace, SFMono-Regular, monospace" font-size="42" fill="#eaecf7" letter-spacing="6">ENDURANCE</text>
  <text x="120" y="248" font-family="ui-sans-serif, system-ui, sans-serif" font-size="36" fill="#c4b5fd">From couldn&apos;t-run-a-kilometre</text>
  <text x="120" y="300" font-family="ui-sans-serif, system-ui, sans-serif" font-size="36" fill="#c4b5fd">to 25k on trails.</text>
</svg>
